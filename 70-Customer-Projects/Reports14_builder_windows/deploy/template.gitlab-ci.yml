# =============================================================================
# .gitlab-ci.yml - Reports deployment (copy to the top folder of the repository)
# =============================================================================
#  push to main -> deploy_dev  (automatic: the files changed since the last
#                               DEV deploy - normally the checked-in report)
#  tag prod-*   -> deploy_prod (automatic: exactly the files of the tagged
#                               commit - one report, set with release_tag.ps1)
#                 -> notify_prod_ok / notify_prod_failed (mail, only PROD;
#                               needs MAIL_TO + sendmail on the runner host)
# There is only the branch main - no merge requests, no release branches.
# Protect the tags prod-* in GitLab: creating one is the release.
# Doc: Git_deploy.md (IHateWeblogic, 70-Customer-Projects/Reports14_builder_windows)
# =============================================================================

stages:
  - deploy
  - notify

variables:
  # full history - deploy_dev compares with the last deployed commit
  GIT_DEPTH: "0"

.deploy:
  stage: deploy
  tags:
    - reports-deploy        # runner with bash, git, ssh that may reach the servers
  interruptible: false

deploy_dev:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  environment:
    name: development
  resource_group: deploy-dev    # one deploy at a time
  script:
    - bash deploy/ci_deploy.sh dev

deploy_prod:
  extends: .deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
  environment:
    name: production
  resource_group: deploy-prod
  script:
    - bash deploy/ci_deploy.sh prod

# --- mail after the PROD deploy (only tag pipelines prod-*) -----------------
# exactly one of the two runs: on_success = deploy_prod green,
# on_failure = deploy_prod red. allow_failure: a mail problem does not turn
# the release red - the deploy itself is shown by deploy_prod.
.notify_prod:
  stage: notify
  tags:
    - reports-deploy
  needs:
    - deploy_prod
  environment:
    name: production            # gets MAIL_TO of the scope production
    action: access              # no new deployment entry
  allow_failure: true

notify_prod_ok:
  extends: .notify_prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
      when: on_success
  script:
    - bash deploy/ci_notify_mail.sh ok

notify_prod_failed:
  extends: .notify_prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
      when: on_failure
  script:
    - bash deploy/ci_notify_mail.sh failed
