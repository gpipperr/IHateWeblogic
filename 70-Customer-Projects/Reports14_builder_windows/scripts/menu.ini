; =============================================================================
; menu.ini - Eintraege fuer menue.ps1 (Startmenue per Doppelklick)
; =============================================================================
; Ein Abschnitt [name] pro Menuepunkt - der Name ist frei waehlbar:
;   Sortierung : Reihenfolge im Menue (kleinste Zahl zuerst), Nummer im Menue
;                = Position, nicht dieser Wert
;   Skript     : Skript im selben Ordner wie menue.ps1
;   Parameter  : optional, wird an das Skript angehaengt (z.B. -List)
;   Kurz       : eine Zeile im Menue
;   Lang       : Erklaerung - wird nach der Auswahl angezeigt
;   Admin      : ja = braucht ein Administrator-Fenster (Reports-Werkzeuge)
;
; Abschnitt [Menue]: Titel und Frage des Menues.
; Zeilen mit ; oder # am Anfang sind Kommentare. Datei als UTF-8 speichern
; (Editor: Speichern unter -> Codierung UTF-8), dann stimmen die Umlaute.
; =============================================================================

[Menue]
Titel = Oracle Reports Git Handling
Frage = Wähle eine Option oder breche mit x ab

[pull]
Sortierung = 10
Skript     = pull.ps1
Kurz       = Hole die letzten Änderungen vom Git-Server
Lang       = Holt den neuesten Stand vom Git-Server. Ihre eigenen, noch nicht eingecheckten Änderungen bleiben erhalten. Zu Arbeitsbeginn ausführen.

[status]
Sortierung = 20
Skript     = status.ps1
Kurz       = Zeige den aktuellen Status an
Lang       = Zeigt, was offen ist: geänderte, aber nicht eingecheckte Dateien, Check-ins, die noch nicht auf dem Git-Server sind, und neue Check-ins der Kollegen. Ändert nichts.

[status_detail]
Sortierung = 30
Skript     = status_detail.ps1
Kurz       = Liste der letzten Check-ins mit Tag und Stand in Produktion
Lang       = Die letzten 20 Check-ins, eine Zeile pro Datei, mit Tag und Spalte Prod (PROD / offen / alt). Ändert nichts.

[checkin]
Sortierung = 40
Skript     = checkin.ps1
Kurz       = Bericht einchecken und nach DEV verteilen
Lang       = Listet die geänderten Berichte, fragt nach Auswahl und Kommentar, wandelt .rdf nach .xml um, checkt jeden Bericht einzeln ein und lädt ihn hoch. Die Pipeline verteilt ihn danach automatisch auf den DEV-Server.
Admin      = ja

[release_list]
Sortierung = 50
Skript     = release_tag.ps1
Parameter  = -List
Kurz       = Zeige, was noch nicht in Produktion ist
Lang       = Zeigt die Check-ins, die noch nicht in Produktion sind, die letzten Check-ins mit ihrem Tag und die letzten Freigaben. Setzt keinen Tag.

[release_tag]
Sortierung = 60
Skript     = release_tag.ps1
Kurz       = Release-Tag setzen - Bericht in Produktion einspielen
Lang       = Auf DEV getestet? Wählen Sie den Check-in aus der Liste (oder eine Commit-ID). Das Skript setzt den prod-Tag, die Pipeline verteilt genau diesen Check-in in die Produktion.
