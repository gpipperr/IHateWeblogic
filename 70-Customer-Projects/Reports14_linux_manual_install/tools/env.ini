# =============================================================================
# env.ini - Domain-Daten fuer status.sh, show_all_logs.sh, show_errors.sh
# Ablage: /u01/oracle/tools/env.ini  (Rechte 640, Besitzer oracle)
# Format: einfache Zeilen NAME="Wert" - keine Leerzeichen um das "=";
# weiter unten zusaetzlich PATH und zwei Kurzbefehle (alias).
# KEINE Kennwoerter in diese Datei schreiben.
# Beschreibung: Tools_status_logs_kochbuch.txt
# =============================================================================

# --- Verzeichnisse -------------------------------------------------------------
ORACLE_HOME="/u01/oracle/fmw"
DOMAIN_HOME="/u01/user_projects/domains/reportRpgpi"
DOMAIN_NAME="reportRpgpi"
# Oracle Net (tnsnames.ora, sqlnet.ora) - gleiches Verzeichnis wie in install.ini;
# set_env.sh exportiert es fuer sqlplus/rwrun in der Shell
TNS_ADMIN="/u01/oracle/admin/tns_names"

# --- WebLogic-Server -------------------------------------------------------------
ADMIN_SERVER="AdminServer"
ADMIN_PORT="7001"
# Managed Server als NAME:PORT, mehrere durch Leerzeichen getrennt,
# z.B. "WLS_FORMS:9001 WLS_REPORTS:9002"
MANAGED_SERVERS="WLS_REPORTS:9002"

# --- Reports-Server (Systemkomponenten, laufen ueber den Node Manager) -------
# mehrere durch Leerzeichen getrennt
REPORTS_SERVERS="repServer01"

# --- Node Manager ----------------------------------------------------------------
NM_HOST="localhost"
NM_PORT="5556"
NM_TYPE="plain"

# --- Gespeicherte Node-Manager-Zugangsdaten (fuer den echten Status) ---------
# Angelegt mit: $DOMAIN_HOME/bin/startComponent.sh repServer01 storeUserConfig
# (Autostart_linux_middleware.txt Schritt 1c). Fehlen sie, zeigt status.sh
# nur Ports, Prozesse und HTTP-Status.
WLST_CONFIG_FILE="$HOME/oracle-WebLogicConfig.properties"
WLST_KEY_FILE="$HOME/oracle-WebLogicKey.properties"

# --- Werkzeuge in den Suchpfad (PATH) ----------------------------------------------
# Danach reicht z.B. "status.sh" statt "/u01/oracle/tools/status.sh".
# (nur einmal anhaengen, auch wenn env.ini mehrfach eingelesen wird)
TOOLS_HOME="/u01/oracle/tools"
case ":$PATH:" in
    *":$TOOLS_HOME:"*) ;;
    *) PATH="$TOOLS_HOME:$PATH" ;;
esac

# --- Kurzbefehle (wirken in der interaktiven Sitzung, nach set_env.sh) ----------
# wlst   : WLST aus oracle_common - mit den FMW-Befehlen (createCred,
#          grantAppRole, Reports-Befehle ...), nicht das reine WebLogic-WLST
#          aus wlserver/common/bin
# domain : ins Domain-Verzeichnis wechseln
alias wlst='"$ORACLE_HOME/oracle_common/common/bin/wlst.sh"'
alias domain='cd "$DOMAIN_HOME"'

# --- Optional ------------------------------------------------------------------
# weitere Ports, die nur auf LISTEN geprueft werden (z.B. Nginx 80/443)
EXTRA_PORTS="80 443"
# show_all_logs.sh / show_errors.sh: nur Logs, die in den letzten
# LOG_MINUTES Minuten geschrieben wurden
LOG_MINUTES="60"
