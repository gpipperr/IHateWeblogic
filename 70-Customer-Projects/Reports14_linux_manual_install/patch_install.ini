# =============================================================================
# patch_install.ini - ALLE Werte dieser Kundenumgebung an EINER Stelle:
#   - fuer die Kochbuecher (Installation, Patch, Absicherung, Betrieb)
#   - fuer die Betriebs-Tools status.sh, show_log.sh, show_errors.sh,
#     show_all_logs.sh (lesen die Datei selbst aus ihrem Verzeichnis)
# Ablage: $ORACLE_BASE/tools/patch_install.ini  (Rechte 600, Besitzer oracle)
#         neben den Tools aus IHateWeblogic/70-Customer-Projects/tools/bash
# Einlesen in die aktuelle Sitzung:  . $ORACLE_BASE/tools/set_script_env.sh
#         Kontrolle danach:          set_script_env_show
# Format: einfache Zeilen NAME="Wert" - keine Leerzeichen um das "=".
# Variablen duerfen auf weiter oben gesetzte verweisen ($DOMAIN_HOME ...).
# KEINE Kennwoerter in diese Datei schreiben.
# Herkunft je Block: OS_/FMW_/Reports_/Font_/SSL_Kochbuch_de.txt,
#                    Autostart_linux_middleware.txt, Tools_status_logs_kochbuch.txt
# Fahrplan: 70-Customer-Projects/Start_beim_Kunden_kochbuch_de.txt
# =============================================================================

# --- Grundverzeichnisse (FMW_Kochbuch_de.txt, VORAUSSETZUNGEN) -----------------
ORACLE_BASE="/u01/oracle"
ORACLE_HOME="$ORACLE_BASE/fmw"
JDK_HOME="$ORACLE_BASE/java/jdk-21"
JAVA_HOME="$JDK_HOME"
PATCH_STORAGE="$ORACLE_BASE/patch_storage"
# Installer auf Oracle Linux 9 (FMW_Kochbuch_de.txt Schritt 2)
CV_ASSUME_DISTID="OEL8"
WLST="$ORACLE_HOME/oracle_common/common/bin/wlst.sh"

# --- Domain und Server (Reports_kochbuch_de.txt, VORAUSSETZUNGEN) --------------
DOMAIN_NAME="reportRpgpi"
DOMAIN_HOME="/u01/user_projects/domains/$DOMAIN_NAME"
WLS_ADMIN_PORT="7001"
WLS_ADMIN_URL="t3://localhost:$WLS_ADMIN_PORT"
WLS_MANAGED_SERVER="WLS_REPORTS"
WLS_REPORTS_PORT="9002"
WLS_NODEMANAGER_PORT="5556"
WLS_SERVER_FQDN="wls01.company.local"
# fuer status.sh / show_log.sh: Name des AdminServers und alle Managed
# Server als NAME:PORT, mehrere durch Leerzeichen, z.B.
# "WLS_FORMS:9001 WLS_REPORTS:9002"
ADMIN_SERVER="AdminServer"
MANAGED_SERVERS="$WLS_MANAGED_SERVER:$WLS_REPORTS_PORT"

# --- Reports-Komponenten (Reports_kochbuch_de.txt) ------------------------------
REPORTS_TOOLS_INSTANCE="reptools1"
REPORTS_SERVER_NAME="repServer01"
# alle Reports-Server fuer status.sh / show_log.sh, durch Leerzeichen getrennt
REPORTS_SERVERS="$REPORTS_SERVER_NAME"
REPORTS_BROADCAST_PORT="14027"
REPORTS_COMPONENT_HOME="$DOMAIN_HOME/config/fmwconfig/components/ReportsToolsComponent/$REPORTS_TOOLS_INSTANCE"
REPORTS_ADMIN="$REPORTS_COMPONENT_HOME/guicommon/tk/admin"
RWSERVER_CONF="$DOMAIN_HOME/config/fmwconfig/components/ReportsServerComponent/$REPORTS_SERVER_NAME/rwserver.conf"
# entsteht erst beim ERSTEN Start des Managed Servers (Reports_kochbuch_de.txt 9.3)
REPORTS_APP_CONF="$DOMAIN_HOME/config/fmwconfig/servers/$WLS_MANAGED_SERVER/applications/reports_14.1.2/configuration"
CGICMD_DAT="$REPORTS_APP_CONF/cgicmd.dat"

# --- Report-Verzeichnisse (Reports_kochbuch_de.txt 9.2) -------------------------
REPORTS_PATH="$ORACLE_BASE/reports/source"
REPORTS_IMAGE_DIR="$ORACLE_BASE/reports/images"
REPORTS_TMP="$ORACLE_BASE/reports/tmp"
REPORTS_NLS_LANG="GERMAN_GERMANY.AL32UTF8"
# EIN Verzeichnis fuer tnsnames.ora / sqlnet.ora - fuer Reports-Server,
# Engines, rwrun, WebLogic und die Shell (Reports_kochbuch_de.txt 9.2)
TNS_ADMIN="$ORACLE_BASE/admin/tns_names"

# --- Fonts (Font_kochbuch_de.txt) ------------------------------------------------
REPORTS_FONT_DIR="$DOMAIN_HOME/reports/fonts"
REPORTS_FONT_DIRECTORY="$REPORTS_FONT_DIR"
UIFONT_ALI="$REPORTS_ADMIN/uifont.ali"
TK_ADMIN="$REPORTS_ADMIN"
TK_FONTALIAS="$UIFONT_ALI"
ORACLE_FONTALIAS="$UIFONT_ALI"
REPORTS_ENHANCED_FONTHANDLING="yes"

# --- Externe Datenbank fuer das RCU (Reports_kochbuch_de.txt Schritt 3) ------
DB_HOST="dbserver01.company.local"
DB_PORT="1521"
DB_SERVICE="ORCLPDB1"
DB_SCHEMA_PREFIX="DEV"
# RCU-Datenbanktyp (Schritt 3): EBR = "Oracle Database enabled for
# edition-based redefinition"
RCU_DB_TYPE="EBR"

# --- SSL-Zertifikat (SSL_Kochbuch_de.txt, FMW_Kochbuch_de.txt) ------------------
SSL_CN="$WLS_SERVER_FQDN"
SSL_CERT_FILE="$ORACLE_BASE/certs/server.crt"
SSL_KEY_FILE="$ORACLE_BASE/certs/server.key"
SSL_CHAIN_FILE="$ORACLE_BASE/certs/chain.crt"
SSL_CSR_FILE="$ORACLE_BASE/certs/server.csr"
SSL_KEY_SIZE="4096"
SSL_DAYS="825"
SSL_COUNTRY="DE"
SSL_STATE="Bavaria"
SSL_CITY="Munich"
SSL_ORG="Company GmbH"
SSL_ORG_UNIT="IT"
# Option D (eigene Root-CA mit openssl): CA-Verzeichnis (700) und Name der Root
SSL_CA_DIR="$ORACLE_BASE/certs/ca"
SSL_CA_CN="Company GmbH Root CA"

# --- Betrieb / Autostart (Autostart_linux_middleware.txt) -----------------------
LOG_DIR="$DOMAIN_HOME/logs"
TOOLS_HOME="$ORACLE_BASE/tools"

# --- Node Manager (status.sh, Autostart_linux_middleware.txt) -------------------
NM_HOST="localhost"
NM_TYPE="plain"
# Port: WLS_NODEMANAGER_PORT (Block Domain und Server)

# --- Gespeicherte Node-Manager-Zugangsdaten (fuer den echten Status) ---------
# Angelegt mit: $DOMAIN_HOME/bin/startComponent.sh repServer01 storeUserConfig
# (Autostart_linux_middleware.txt Schritt 1c). Fehlen sie, zeigt status.sh
# nur Ports, Prozesse und HTTP-Status.
WLST_CONFIG_FILE="$HOME/oracle-WebLogicConfig.properties"
WLST_KEY_FILE="$HOME/oracle-WebLogicKey.properties"

# --- Betriebs-Tools, optional (Tools_status_logs_kochbuch.txt) -----------------
# weitere Ports, die status.sh nur auf LISTEN prueft (z.B. Nginx 80/443)
EXTRA_PORTS="80 443"
# show_all_logs.sh / show_errors.sh: nur Logs der letzten LOG_MINUTES Minuten
LOG_MINUTES="60"
