# =============================================================================
# wlsmon_rules.cfg - default log rules of wlsmon (concept section 4.3)
#
# One rule per line, ";"-separated:  type;id;level;source;regex;reason
#   type    match  = count the log entry and set the level
#           ignore = drop a known harmless entry before anything is counted
#   id      unique name [a-z0-9_]; a rule with the same id in
#           $WLSMON_BASE/etc/wlsmon_rules.local.cfg replaces this one
#   level   warn | crit for match, - for ignore
#   source  wls (WebLogic server logs) | forms | reports | nginx | *
#   regex   Python regular expression, applied to the whole log entry
#           (a WebLogic / ODL entry including its stack trace)
#   reason  mandatory for ignore: why the message is harmless
#
# Evaluation: ignore first, then match; an entry counts once with the highest
# level of all matching rules. <Error> / <Critical> entries without a rule count
# under "unclassified". Hits per rule id (ignored ones included) go to logs.json.
#
# Test against a log:  wlsmon.py rules --test <logfile> --source wls,forms
# An ignore rule is added only after the message was checked in real logs
# (development plan step 6f); its reason names where and when it was checked.
# =============================================================================

# --- WebLogic: JVM and threads ------------------------------------------------
match;oom;crit;*;OutOfMemoryError;heap or native memory exhausted
match;stuck;crit;wls;BEA-000337;stuck thread
match;critical_service;crit;wls;BEA-000383;a critical service failed, the server shuts itself down
match;thread_constraint;warn;wls;BEA-002936;maximum thread constraint reached
match;server_failed;crit;wls;BEA-000362|BEA-000386;server failed / subsystem failed (not BEA-000365: a normal state change)
match;overload;warn;wls;BEA-002932|BEA-002933|BEA-002934;work manager overload
match;wls_lockout;warn;wls;BEA-090078;account locked after invalid logins
match;wls_auth_fail;warn;wls;BEA-090938|BEA-000000.*[Aa]uthentication [Ff]ailed;failed authentication

# --- Database / RCU (data sources, connection pools) --------------------------
match;rcu_login;crit;*;ORA-01017|ORA-28000|ORA-28001;RCU schema login refused (ORA-01017, ORA-28000, ORA-28001)
match;db_unreachable;crit;*;ORA-12514|ORA-12541|ORA-12170|IO Error: The Network Adapter;database not reachable
match;db_connect_failed;warn;wls;BEA-001129;connection for a data source could not be created
ignore;bea_001156;-;wls;BEA-001156;stack trace entry that follows BEA-001129 - counted there (test host 2026-11-19)
match;db_closed;warn;*;ORA-17008|ORA-03113;database connection closed (DB restart / network)
match;pool_exhausted;warn;wls;ResourceLimitException;connection pool exhausted
match;jps_error;warn;*;JPS-\d{5};OPSS / JPS error (security store, LDAP, network)

# --- Forms --------------------------------------------------------------------
match;frm_abnormal;warn;forms;FRM-93652;Forms runtime ended abnormally
match;frm_startup;warn;forms;FRM-92101|FRM-92050|FRM-92102;Forms server start / connection failure
match;frm_heartbeat;warn;forms;FRM-92120;Forms heartbeat / registry problem

# --- Reports ------------------------------------------------------------------
match;rep_engine_crash;crit;reports;REP-56048|REP-56055|REP-56105;Reports engine crashed / could not start
match;rep_login;warn;reports;REP-50171|LDAP: error code 49;failed Reports login (REP-50171, LDAP 49)
match;rep_not_reachable;crit;reports;REP-51002|REP-56092;Reports server not reachable
ignore;rep_server_start;-;reports;REP-5000[12]\b;Reports server initializing / shutting down - logged as INCIDENT_ERROR, a normal start / stop (test host 2026-11-19)
match;rep_exception;warn;reports;REP-50125|REP-501\d\d;report failed
match;rep_job_invalid;warn;reports;REP-50006;invalid job command (e.g. SCHEDULE argument)
match;rep_font;warn;reports;REP-1924|REP-3000|REP-1352;font / output problem

# --- nginx (error.log is counted separately; rules for later use) -------------
match;nginx_upstream;warn;nginx;upstream timed out|no live upstreams|connect\(\) failed;upstream WebLogic not reachable
