.jar, frmwebutil.jar,</tspan><tspan x="594" dy="21.2">frmsal.jar ...</tspan><tspan x="594" dy="21.2">signed by &#34;Oracle America&#34;</tspan><tspan x="594" dy="21.2">(DigiCert code-signing CA,</tspan><tspan x="594" dy="21.2">timestamped)</tspan></text></g><g class="Y3VzdG9tZXIuamFycw=="><g class="shape" ><rect x="40" y="60" width="310" height="131" rx="8" stroke="#7F7F7F" fill="#EDEDED" style="stroke-width:1;" /></g><text x="195" y="102.5" fill="#C00000" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="195" dy="0">jacob.jar, own jars (icons ...)</tspan><tspan x="195" dy="21.5">- unsigned when downloaded</tspan><tspan x="195" dy="21.5">- sign with YOUR code-signing</tspan><tspan x="195" dy="21.5">certificate (jarsigner + TSA)</tspan></text></g><g class="KG9yYWNsZSAtJmd0OyBjbGllbnQpWzBd"><marker id="mk-d2-2867421827-2712386899" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#7F7F7F" class="connection" stroke-width="2" /> </marker><path d="M 594 232 C 594 310.5 573.799988 346.5 495.743609 408.326844" stroke="#7F7F7F" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2867421827-2712386899)" mask="url(#d2-2867421827)" /><text x="578.5" y="327" fill="#000000" class="text-italic" style="text-anchor:middle;font-size:18px"><tspan x="578.5" dy="0">base.jnlp / webutil.jnlp</tspan><tspan x="578.5" dy="19.666667">(one signer</tspan><tspan x="578.5" dy="19.666667">per JNLP file)</tspan></text></g><g class="KGN1c3RvbWVyIC0mZ3Q7IGNsaWVudClbMF0="><path d="M 195 222 C 195 308.5 215.199997 346.5 293.25639 408.326844" stroke="#7F7F7F" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2867421827-2712386899)" mask="url(#d2-2867421827)" /><text x="208.5" y="323" fill="#000000" class="text-italic" style="text-anchor:middle;font-size:18px"><tspan x="208.5" dy="0">extensions.jnlp</tspan><tspan x="208.5" dy="