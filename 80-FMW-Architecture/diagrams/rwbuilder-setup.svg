wconfig/components/</tspan><tspan x="242" dy="21">ReportsToolsComponent/reptools1</tspan><tspan x="242" dy="21">(rwbuilder.conf, uifont.ali, ...)</tspan></text></g><g class="d2luc3J2LmZvbnRz"><g class="shape" ><rect x="16" y="753" width="452" height="71" rx="8" stroke="#548235" fill="#E2EFDA" style="stroke-width:1;" /></g><text x="242" y="795.5" fill="#C00000" class="text-bold" style="text-anchor:middle;font-size:20px">fonts (same TTFs as the Linux server)</text></g><g class="KHdvcmtzdGF0aW9uLnJkcF9jbGllbnQgLSZndDsgd2luc3J2KVswXQ=="><marker id="mk-d2-2890106043-2712386899" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#7F7F7F" class="connection" stroke-width="2" /> </marker><path d="M 242 122.5 C 242 161 242 244.899994 242 291" stroke="#7F7F7F" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2890106043-2712386899)" mask="url(#d2-2890106043)" /><text x="242" y="214" fill="#000000" class="text-italic" style="text-anchor:middle;font-size:18px">RDP</text></g><g class="KHdpbnNydiAtJmd0OyBsaW51eF9yZXBvcnRzKVswXQ=="><path d="M 242 841 C 242 896.299988 242 924.700012 242 978" stroke="#7F7F7F" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2890106043-2712386899)" mask="url(#d2-2890106043)" /><text x="242.5" y="908" fill="#000000" class="text-italic" style="text-anchor:middle;font-size:18px"><tspan x="242.5" dy="0">file copy /</tspan><tspan x="242.5" dy="20.5">share / sftp</tspan></text></g><g class="KGxpbnV4X3JlcG9ydHMgLSZndDsgY3VzdG9tZXJfZGIpWzBd"><path d="M 242 1093 C 242 1137.099976 242 1160.800049 242 1206.5" stroke="#7F7F7F" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-2890106043-2712386899)" mask="url(#d2-2890106043)" /><text x="242.5" y="1157" fill="#000000" class="text-italic" style="text-anchor:middle;font-size:18px">SQL*Net</text></g><mask id="d2-2890106043" maskUni