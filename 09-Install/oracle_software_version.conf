# =============================================================================
# oracle_software_version.conf – FMW 14.1.2 software versions and patch numbers
# =============================================================================
# This file defines WHAT to download. It can be committed to git – no credentials.
#
# TWO download sources:
#   [eDelivery]   https://edelivery.oracle.com  – base installers (V*.zip)
#   [getMOSPatch] getMOSPatch.jar               – OPatch + individual patches
#
# MOS credentials: environment.conf (MOS_USER) + mos_sec.conf.des3 (password)
# Used by: 09-Install/04-oracle_pre_download.sh
# =============================================================================

# --- getMOSPatch platform configuration [getMOSPatch] ------------------------
MOS_PLATFORM="226P"      # 226P = Linux x86-64 | 233P = Linux ARM 64 | 46P = Windows x86-64
MOS_LANGUAGE="4L"        # 4L = German (D) | 1 = English

# =============================================================================
# PRODUCT RELEASE - used to validate downloaded patch ZIPs before extraction
# =============================================================================
# Expected Oracle component version inside each patch's inventory.xml
# (majority value across its <required_components> entries - component
# naming differs per product: oracle.wls.* for WLS, oracle.reports.* for
# Reports QPRs, oracle.developer.forms.* for Forms QPRs). Some MOS patch
# numbers ship several product-version variants under the identical patch
# number (e.g. Patch 39988381 ships 12.2.1.4.0 / 14.1.1.0.0 / 14.1.2.0.0 /
# 15.1.1.0.0 builds) - check_patch_zip() (00-Setup/IHateWeblogic_lib.sh)
# compares this value against the downloaded ZIP to catch a wrong-release
# download before it is ever extracted. Not the same as
# OPATCH_VERSION_MIN/_INSTALL below, which are OPatch tool versions, not the
# product release.
FMW_PRODUCT_RELEASE="14.1.2.0.0"

# =============================================================================
# INSTALLER ENVIRONMENT OVERRIDES
# =============================================================================
# CV_ASSUME_DISTID: instructs the Oracle CV (Configuration Validation) checker
# to treat this system as OEL8. Required on Oracle Linux 9 because the installer
# CV tool does not natively recognise OL9.
# Set only for the duration of the installer run (export/unset in install script).
# No official Oracle Note known; widely used in practice for FMW 14.1.2 on OL9.
CV_ASSUME_DISTID="OEL8"

# =============================================================================
# BASE INSTALLERS – download from Oracle Software Delivery Cloud (eDelivery)
# https://edelivery.oracle.com
# Unzip into $PATCH_STORAGE/wls/ resp. $PATCH_STORAGE/fr/ before running installer.
# =============================================================================

# --- Oracle Fusion Middleware Infrastructure 14.1.2 [eDelivery] --------------
# eDelivery search: Oracle Fusion Middleware Infrastructure 14.1.2.0.0 for Linux x86-64
FMW_INFRA_EDEL_SEARCH="Oracle Fusion Middleware Infrastructure 14.1.2.0.0 for Linux x86-64"
FMW_INFRA_ZIP="V1045135-01.zip"
FMW_INFRA_FILENAME="fmw_14.1.2.0.0_infrastructure.jar"   # extracted from ZIP
FMW_INFRA_SHA256="1AAE35167BDED101E7194AA3D75C26B292010035A36C289A3F90B663D84E68BD"

# --- Oracle Forms and Reports 14.1.2 [eDelivery] -----------------------------
# eDelivery search: Oracle Forms and Reports 14.1.2.0.0
# Only needed when INSTALL_COMPONENTS = FORMS_AND_REPORTS | FORMS_ONLY | REPORTS_ONLY
FMW_FR_EDEL_SEARCH="Oracle Forms and Reports 14.1.2.0.0"
FMW_FR_ZIP="V1045121-01.zip"
FMW_FR_FILENAME="fmw_14.1.2.0.0_fr_linux64.bin"          # extracted from ZIP
FMW_FR_SHA256="01D7A1042F0896FA5BDDD1EA268C1B60452476032819AAA307A789B15373175B"
# Note: same ZIP is shown as "Oracle Forms 14.1.2.0.0" and "Oracle Reports 14.1.2.0.0" on eDelivery

# =============================================================================
# PATCH CYCLE – which Oracle security release the patch numbers below implement
# =============================================================================
# Update together with the patch numbers every cycle (CPU Jan/Apr/Jul/Oct or
# monthly CSPU, see docs/00-patch-references.md "Terms"). Read by
# 10-Monitoring/cve_inventory.sh: advisories released after PATCH_CYCLE_DATE
# are reported as "not yet covered".
PATCH_CYCLE="CSPU Sep 2026"
PATCH_CYCLE_DATE="2026-09-15"          # release date of that advisory (third Tuesday)
PATCH_CYCLE_ADVISORY="cspusep2026"     # https://www.oracle.com/security-alerts/<this>.html

# =============================================================================
# OPATCH – download from MOS via getMOSPatch
# Patch 6880880 is the permanent OPatch download number (all versions).
# Always update OPatch BEFORE applying any patches.
# See docs/00-patch-references.md for the MOS Doc IDs behind these numbers.
# =============================================================================

OPATCH_PATCH_NR="6880880"
OPATCH_VERSION_MIN="13.9.4.2.24"      # minimum required by the WLS SPB (CSPU Sep 2026, Patch 39925660)
OPATCH_VERSION_INSTALL="13.9.4.2.24"  # version actually installed by OPATCH_UPGRADE_PATCH_NR

# Patch 28186730: OPatch upgrade patch for FMW/WLS 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0
# This is the FMW/WLS-specific OPatch upgrade patch (since OPatch >= 13.6 uses OUI tooling).
# When unzipped it contains a 6880880/ directory with opatch_generic.jar.
# Download via getMOSPatch alongside the other patches.
OPATCH_UPGRADE_PATCH_NR="28186730"

# Filename regexp for getMOSPatch to select the correct build from patch 6880880 (legacy).
# OPatch 13.9.x Generic is the WLS/FMW variant; the DB-specific Linux ZIPs are not needed.
# Matches: p6880880_139000_Generic.zip
OPATCH_REGEXP="p6880880_139000_Generic"

# =============================================================================
# WLS STACK PATCH BUNDLE (SPB) – applied via opatch napply, NOT opatch apply
# Reintroduced for FMW 14.1.2 in the CSPU September 2026 cycle (Oracle changed
# the patch delivery model again — see the corrected note in
# docs/05-oracle_patch_weblogic.md). Applied by 05-oracle_patch_weblogic.sh
# BEFORE the simple per-patch INSTALL_PATCHES loop below.
# =============================================================================

WLS_SPB_PATCH_NR="39925660"            # WLS SPB 14.1.2.0.260825
WLS_SPB_VERSION="14.1.2.0.260825"      # documentation/log output only
WLS_SPB_MARKER_PATCH="39925694"        # makes the SPB visible in "opatch lspatches" – idempotency check
WLS_SPB_PATCHLIST_FILE="linux64_patchlist.txt"   # this project targets Linux x86-64 only

# =============================================================================
# JAVA SE – minimum Oracle JDK 21 update for the current patch cycle
# =============================================================================
# Checked by 02b-root_os_java.sh (WARN if the JDK at JDK_HOME is older).
# CSPU Sep 2026: Java SE 21.0.12.1 or higher – Patch 35702194 (CPU349, KA1182);
# JDK 17 alternative: Patch 33181589, 17.0.20.1+. See docs/00-patch-references.md.
# The JDK is not patched via OPatch: install the new version next to the old
# one and repoint the JDK_HOME symlink (jdk-21 -> jdk-21.0.x).
JDK_PATCH_NR="35702194"
JDK_VERSION_MIN="21.0.12.1"

# =============================================================================
# JACOB – Java COM bridge for WebUtil OLE / Office automation (CLIENT_OLE2)
# =============================================================================
# Not shipped by Oracle (LGPL). Only used with FORMS_WEBUTIL_JACOB=true in
# environment.conf: 04-oracle_pre_download.sh downloads the ZIP to
# $PATCH_STORAGE/jacob/, 14-oracle_setup_forms.sh installs jar + DLLs.
# Forms 14.1.2 is preconfigured for 1.21 (webutil.cfg install.syslib entries
# name|size|version – a different version needs new sizes here).
# GitHub publishes no checksum – SHA-256 computed after the download 2026-10-15.
# Background: 80-FMW-Architecture/forms_jakob_webutil.md
JACOB_VERSION="1.21"
JACOB_ZIP="jacob-1.21.zip"
JACOB_URL="https://github.com/freemansoft/jacob-project/releases/download/Root_B-1_21/jacob-1.21.zip"
JACOB_SHA256="23a006e84f41443e735cfc3d47f053b995b1454f4ed54c405e7f1e104ef2e073"
JACOB_DLL_X86_SIZE="195072"
JACOB_DLL_X64_SIZE="247296"

# =============================================================================
# POST-INSTALL PATCHES – apply via plain "opatch apply" after the WLS SPB above
# Apply in the order listed. Check each patch README for prerequisites.
# =============================================================================

# --- CSPU September 2026 ------------------------------------------------------
# 39988381  WLS 14.1.2 SPU for CVE-2026-70748 (in addition to the SPB) –
#           check the README inside the downloaded ZIP first: the README text
#           on the MOS portal references AutoPatch/patch_39988381.xml, which is
#           E-Business Suite terminology and looks like a placeholder; expect
#           a normal "opatch apply" once the real ZIP README is read.
#           Same patch number is also used for WLS 15.1.1.0 (paired there with
#           PSU 39929333, which is NOT relevant to this 14.1.2 project):
#             14.1.2.0  -> SPB 39925660 + 39988381   (this project)
#             15.1.1.0  -> PSU 39929333 + 39988381   (not applicable here)
#           check_patch_zip() enforces FMW_PRODUCT_RELEASE automatically; see
#           docs/05-oracle_patch_weblogic.md and docs/00-patch-references.md
#           for the full table and evidence (source: KA1182).
# 38590500  FMW PERL Security Patch – MOVED to INSTALL_PATCHES_FR_COMMON below:
#           its component oracle.perlint is not part of the FMW Infrastructure
#           home – OPatch skips it there ("none of the components ... present",
#           confirmed live 2026-10-14).
# 38566996  UMS Bundle Patch 14.1.2.0.251022 (CPU Jan 2026) – REMOVED for the
#           CSPU Sep 2026 cycle: not on the Sep 2026 required list from KA1182
#           (docs/00-patch-references.md). Was a leftover of the January cycle.
#           UMS is not part of the WLS SPB – if KA1182 lists a newer
#           UMS/Infrastructure patch in a later cycle, add it here.
# Apply order: list patches in the order OPatch must apply them.
INSTALL_PATCHES="39988381"

# Minimum OPatch version required by the current INSTALL_PATCHES set
# (matches OPATCH_VERSION_MIN above – kept here for documentation clarity)
OPATCH_PATCHES_MIN="13.9.4.2.24"

# --- Forms & Reports specific patches ----------------------------------------
# Used by: 06-oracle_patch_forms_reports.sh, 04-oracle_pre_download.sh
# Space-separated lists (same format as INSTALL_PATCHES). INSTALL_PATCHES_FORMS
# is only applied if $ORACLE_HOME/forms exists (Forms-only or combined installs);
# INSTALL_PATCHES_REPORTS is always applied if $ORACLE_HOME/reports exists.
# F&R shares ORACLE_HOME with WLS — INSTALL_PATCHES patches are already
# applied to the full home. Add FR-specific patch numbers here only for
# patches that are NOT included in the WLS SPB/CPU bundle.
#
# INSTALL_PATCHES_FR_COMMON: patches for components that only the Forms &
# Reports installer brings, applied if Forms OR Reports is installed:
#   38590500  FMW PERL Security Patch Update 14.1.2.0.260120 (component
#             oracle.perlint 5.38.2) – requires DBCLIENT >= 23.26 from the WLS
#             SPB, which 05- applies before 06- runs.
#             Assumption to confirm in the 06- run: the F&R installer brings
#             oracle.perlint. If OPatch skips it there as well, 06- reports it as
#             SKIPPED (WARN), not as an error.
INSTALL_PATCHES_FR_COMMON="38590500"
#
# QPR Sep/Aug 2026 (Source: MOS KA204, see docs/00-patch-references.md):
#   Reports 14.1.2 QPR: 39600348  (Linux-x86-64, 14.1.2.0.0, Aug 2026)
#     Supersedes 38827528 (Jan 2026) — contains all of its fixes (rwconverter
#     ORA-00933, Hebrew display, ADB 23ai SRW, cgicmd.dat encryption) plus new
#     ones. If 38827528 is still installed, 06-oracle_patch_forms_reports.sh
#     rolls it back automatically before applying 39600348.
#     Applying it can end with "OPatch Session completed with warnings"
#     (two known-harmless linker notices, confirmed 2026-10-14) - this is
#     NOT a failure; see docs/06-oracle_patch_forms_reports.md for details.
#   Forms 14.1.2 QPR:   39842516  (Linux-x86-64, 14.1.2.0.0, Sep 2026)
#     Supersedes 38874285 (Jan 2026), same automatic-rollback handling.
#     Only applied when Forms is actually installed in this ORACLE_HOME.
INSTALL_PATCHES_REPORTS="39600348"
INSTALL_PATCHES_FORMS="39842516"

# One-off, only needed together with 39600348 when REPORTS_BIDIPARENTHESIS=YES
# (bidirectional/Hebrew parenthesis display fix, bug 38936596) — leave empty
# unless that NLS setting is actually used.
INSTALL_PATCHES_FR_OPTIONAL="38936596"

# --- Superseded (kept as documentation, not read by any script) -------------
# 38827528  Reports QPR Jan 2026 -> superseded by 39600348
# 38874285  Forms QPR Jan 2026   -> superseded by 39842516
