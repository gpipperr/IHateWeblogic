# =============================================================================
# PATCH NUMBERS – read from download/patches_fmw.csv (the per-cycle list)
# =============================================================================
# One list for the library and for the standalone download tool
# 70-Customer-Projects/tools/mos_patch_download.sh (host without the library,
# e.g. a share host with MOS access). Each cycle: update the CSV, not this
# file and not the scripts. Format + roles: download/README.md.
# Sets the variables the scripts have always read (same names, same format):
#   opatch -> OPATCH_UPGRADE_PATCH_NR   spb -> WLS_SPB_PATCH_NR
#   wls -> INSTALL_PATCHES              fr_common -> INSTALL_PATCHES_FR_COMMON
#   reports / forms / fr_optional -> INSTALL_PATCHES_REPORTS / _FORMS / _FR_OPTIONAL
#   jdk -> JDK_PATCH_NR                 client_jdk -> CLIENT_JDK_PATCH_NR + _PLATFORM
#   cvu -> DB_CVU_PATCH_NR + _REGEXP    apex -> APEX_PATCH_NR + _PLATFORM
# IHW_PATCH_ROWS keeps all rows ("nr;platform;regexp;required;step;desc;dir;sha256")
# for the SHA-256 soft check (lib: patch_zip_sha_check) and 04- (--steps).
# Self-contained (no library): every consumer sources only this file.
IHW_PATCH_CSV="${IHW_PATCH_CSV:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/download/patches_fmw.csv}"
OPATCH_UPGRADE_PATCH_NR=""; WLS_SPB_PATCH_NR=""; INSTALL_PATCHES=""
INSTALL_PATCHES_FR_COMMON=""; INSTALL_PATCHES_REPORTS=""; INSTALL_PATCHES_FORMS=""
INSTALL_PATCHES_FR_OPTIONAL=""; JDK_PATCH_NR=""; CLIENT_JDK_PATCH_NR=""
CLIENT_JDK_PLATFORM="233P"; DB_CVU_PATCH_NR=""; DB_CVU_REGEXP=""
APEX_PATCH_NR=""; APEX_PATCH_PLATFORM="2000P"; IHW_PATCH_ROWS=""
if [ -f "$IHW_PATCH_CSV" ]; then
    while IFS= read -r _ihw_l || [ -n "$_ihw_l" ]; do
        _ihw_l="${_ihw_l%$'\r'}"
        case "$_ihw_l" in ''|'#'*|patch\;*) continue ;; esac
        IFS=';' read -r _ihw_nr _ihw_pl _ihw_re _ihw_req _ihw_st _ihw_rest <<< "$_ihw_l"
        [[ "$_ihw_nr" =~ ^[0-9]+$ ]] || continue
        IHW_PATCH_ROWS="${IHW_PATCH_ROWS}${_ihw_l}"$'\n'
        case "$_ihw_st" in
            opatch)      : "${OPATCH_UPGRADE_PATCH_NR:=$_ihw_nr}" ;;
            spb)         : "${WLS_SPB_PATCH_NR:=$_ihw_nr}" ;;
            wls)         INSTALL_PATCHES="${INSTALL_PATCHES:+$INSTALL_PATCHES }$_ihw_nr" ;;
            fr_common)   INSTALL_PATCHES_FR_COMMON="${INSTALL_PATCHES_FR_COMMON:+$INSTALL_PATCHES_FR_COMMON }$_ihw_nr" ;;
            reports)     INSTALL_PATCHES_REPORTS="${INSTALL_PATCHES_REPORTS:+$INSTALL_PATCHES_REPORTS }$_ihw_nr" ;;
            forms)       INSTALL_PATCHES_FORMS="${INSTALL_PATCHES_FORMS:+$INSTALL_PATCHES_FORMS }$_ihw_nr" ;;
            fr_optional) INSTALL_PATCHES_FR_OPTIONAL="${INSTALL_PATCHES_FR_OPTIONAL:+$INSTALL_PATCHES_FR_OPTIONAL }$_ihw_nr" ;;
            jdk)         : "${JDK_PATCH_NR:=$_ihw_nr}" ;;
            client_jdk)  [ -z "$CLIENT_JDK_PATCH_NR" ] && { CLIENT_JDK_PATCH_NR="$_ihw_nr"; CLIENT_JDK_PLATFORM="${_ihw_pl%%|*}"; } ;;
            cvu)         [ -z "$DB_CVU_PATCH_NR" ] && { DB_CVU_PATCH_NR="$_ihw_nr"; DB_CVU_REGEXP="$_ihw_re"; } ;;
            apex)        [ -z "$APEX_PATCH_NR" ] && { APEX_PATCH_NR="$_ihw_nr"; APEX_PATCH_PLATFORM="${_ihw_pl%%|*}"; } ;;
        esac
    done < "$IHW_PATCH_CSV"
    unset _ihw_l _ihw_nr _ihw_pl _ihw_re _ihw_req _ihw_st _ihw_rest
else
    printf "\033[33mWARN\033[0m  patch list not found: %s – all patch numbers empty\n" "$IHW_PATCH_CSV" >&2
fi
