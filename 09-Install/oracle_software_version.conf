# =============================================================================
# PATCH CYCLE – which Oracle security release the patch numbers below implement
# =============================================================================
# Update together with the patch numbers every cycle (CPU Jan/Apr/Jul/Oct or
# monthly CSPU, see docs/00-patch-references.md "Terms"). Read by
# 10-Monitoring/cve_inventory.sh: advisories released after PATCH_CYCLE_DATE
# are reported as "not yet covered".
# State 2026-11-18: values below = CSPU Nov 2026 (KA1182 of 2026-11-17,
# CPU450 / CPU435 / CPU431; what/why: docs/00-patch-references.md, manual
# procedure + README facts: 70-Customer-Projects/FormsReports14_patch_cspu_2026-11/,
# applied on the test host 2026-11-18). KA1182 is cumulative: a CSPU set
# still contains the patches of the last CPU (download/patches_fmw.csv).
# Previous cycles frozen in docs/00-patch-references_october_2026.md (CPU Oct
# 2026) and docs/00-patch-references_september_2026.md.
PATCH_CYCLE="CSPU Nov 2026"
PATCH_CYCLE_DATE="2026-11-17"          # release date of that advisory (third Tuesday)
PATCH_CYCLE_ADVISORY="cspunov2026"      # https://www.oracle.com/security-alerts/<this>.html

